<section class="resumo">
  <!--
    ✅ PASSO 2C · SOLUÇÃO (signals no template): signal se LÊ chamando como função, com parênteses.
    Sem os () você mostraria a função em vez do número.
  -->
  <div><strong>{{ service.total() }}</strong><span>Total</span></div>
  <div><strong>{{ service.pendentes() }}</strong><span>Pendentes</span></div>
  <div><strong>{{ service.concluidas() }}</strong><span>Concluídas</span></div>

  <!--
    ✅ PASSO 2D · SOLUÇÃO: [style.width.%] liga a largura da barra (em %) ao computed `percentual()`.
    Quando uma tarefa é concluída, o computed recalcula e a barra cresce sozinha.
  -->
  <div class="barra">
    <div class="barra-preenchida" [style.width.%]="percentual()"></div>
  </div>
  <small>{{ percentual() }}% concluído</small>
</section>
