<section class="lista">
  <div class="filtros">
    <!--
      ✅ PASSO 6F · SOLUÇÃO (two-way binding com model): [(texto)]="busca" liga o model `texto` do
      CampoBusca ao signal `busca` da Lista, nos dois sentidos. Digitou lá, `busca` muda aqui.
    -->
    <app-campo-busca [(texto)]="busca" />

    <select (change)="escolherCategoria($any($event.target).value)">
      @for (c of categorias; track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
  </div>

  <!--
    ✅ PASSO 6G · SOLUÇÃO (async pipe + @for):
    • `| async` assina o Observable e cancela a assinatura sozinho (sem subscribe/unsubscribe manual,
      sem risco de vazamento de memória). `as tarefas` guarda o valor emitido.
    • @for repete o card para cada tarefa; `track t.id` é a chave única que o Angular usa para
      reaproveitar os elementos.
    • (alternar)/(remover) recebem o id emitido pelo output do card ($event).
    • @empty aparece quando a lista filtrada fica vazia.
  -->
  @if (tarefasFiltradas$ | async; as tarefas) {
    @for (t of tarefas; track t.id) {
      <app-card-tarefa [tarefa]="t" (alternar)="alternar($event)" (remover)="remover($event)" />
    } @empty {
      <p class="vazio">Nenhuma tarefa encontrada.</p>
    }
  }
</section>
